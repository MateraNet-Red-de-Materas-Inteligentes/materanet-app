org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# D-03 — Los tres targets de iOS no se pueden compilar en Linux: se declaran y quedan
# deshabilitados. La advertencia se oculta a propósito, porque está registrada en el
# design.md y volver a mostrarla en cada build solo distrae.
kotlin.native.ignoreDisabledTargets=true

kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true
